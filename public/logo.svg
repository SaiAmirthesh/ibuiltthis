<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 120" fill="none">
  <defs>
    <linearGradient id="saSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#F1F5F9" />
      <stop offset="85%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <filter id="glowDot" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00D8FF" flood-opacity="1" />
    </filter>
  </defs>

  <!-- Letter S -->
  <path 
    d="M 68 34 H 36 C 26 34 20 40 20 49 C 20 58 26 63 36 65 L 52 68 C 62 70 68 76 68 85 C 68 94 61 100 50 100 H 22" 
    stroke="url(#saSilver)" 
    stroke-width="11" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />

  <!-- Letter A -->
  <!-- Left diagonal slash -->
  <line 
    x1="76" y1="68" 
    x2="88" y2="34" 
    stroke="url(#saSilver)" 
    stroke-width="11" 
    stroke-linecap="round"
  />
  <!-- Right diagonal leg from peak -->
  <line 
    x1="88" y1="34" 
    x2="114" y2="100" 
    stroke="url(#saSilver)" 
    stroke-width="11" 
    stroke-linecap="round"
  />

  <!-- Glowing Cyan Dot -->
  <circle cx="126" cy="98" r="6" fill="#00E5FF" filter="url(#glowDot)" />
</svg>
